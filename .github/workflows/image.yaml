name: image

on:
  push:
    # This repository tags bare semver (2.0.0), not v-prefixed; both are accepted so a tag
    # in either style publishes rather than silently doing nothing.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (defaults to the version in PFv2.sh)
        required: false

permissions:
  contents: read

jobs:
  # The `secrets` context is not available in a job-level `if`, so the credentials cannot be
  # tested there. Doing it anyway makes the whole file invalid, and GitHub then reports a
  # zero-second failed run against every push while no tag ever publishes anything. They are
  # read in a step instead, where the context does exist, and the result is passed on as an
  # output.
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # Publishing is optional. Without Docker Hub credentials the job is skipped rather than
  # failed: a release should not be marked red because an optional step has no secrets, and
  # an image can always be pushed by hand with `make image`.
  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        run: |
          version="${{ inputs.tag }}"
          if [ -z "$version" ]; then
            version=$(grep -m1 '^readonly VERSION=' PFv2.sh | cut -d'"' -f2)
          fi
          # A v-prefixed tag still produces an unprefixed image tag.
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.DOCKERHUB_NAMESPACE || 'conidiobolus' }}/pfv2:$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are repository secrets; the token should be a
      # Docker Hub access token scoped to this repository, not an account password.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image self-tests during build (stages 2, 3 and 5 against a synthetic dataset),
      # so a broken build cannot be pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE || 'conidiobolus' }}/pfv2:${{ steps.version.outputs.version }}
            ${{ vars.DOCKERHUB_NAMESPACE || 'conidiobolus' }}/pfv2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The published amd64 image has never been run on an amd64 machine: the build runs its
  # non-native stage under QEMU, and the maintainer's hardware is arm64. Under emulation STAR
  # dies with "Illegal instruction" while Bowtie2 and samtools are fine, so emulation cannot
  # distinguish a broken amd64 build from a QEMU limitation. GitHub's runners are amd64, so
  # this answers the question natively, after push, against the artefact users will pull.
  verify-amd64:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # Logged in to pull as an authenticated user; anonymous pulls on shared runners hit
      # Docker Hub's rate limit often enough to turn this job into a coin toss.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check the manifest offers both architectures
        run: |
          image='${{ needs.publish.outputs.image }}'
          docker buildx imagetools inspect "$image" > manifest.txt
          cat manifest.txt
          for want in linux/amd64 linux/arm64; do
            grep -q "$want" manifest.txt || {
              echo "::error title=Missing platform::$image does not offer $want"
              exit 1
            }
          done

      - name: Pull the amd64 image and confirm that is what ran
        run: |
          image='${{ needs.publish.outputs.image }}'
          docker pull --platform linux/amd64 "$image"
          arch=$(docker run --rm --platform linux/amd64 "$image" bash -c 'uname -m')
          echo "container reports: $arch"
          [ "$arch" = "x86_64" ] || {
            echo "::error title=Wrong architecture::expected x86_64, got $arch"
            exit 1
          }

      # Exits non-zero if a tool is absent, or present and unable to report a version. The
      # second case is the one that was silent before: a binary that dies on its first
      # instruction printed an empty string and exited 0.
      - name: Every bundled tool reports a version
        run: |
          image='${{ needs.publish.outputs.image }}'
          docker run --rm --platform linux/amd64 "$image" version

      - name: The Java stages pass
        run: |
          image='${{ needs.publish.outputs.image }}'
          docker run --rm --platform linux/amd64 "$image" selftest

      # The step the build itself cannot run. It is what catches an aligner that reports a
      # version and then cannot align.
      - name: STAR, Bowtie2 and samtools actually align
        run: |
          image='${{ needs.publish.outputs.image }}'
          docker run --rm --platform linux/amd64 "$image" selftest --aligners

  # Says plainly why nothing was published, instead of leaving a silently absent job.
  skipped:
    needs: gate
    if: needs.gate.outputs.publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why no image was published
        run: |
          echo "::notice title=Image not published::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are \
          not set on this repository, so no image was pushed. Set them under Settings > \
          Secrets and variables > Actions to publish on future tags, or push by hand with \
          'make image'. An image can also be pushed by hand."
