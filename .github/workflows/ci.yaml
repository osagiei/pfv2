name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and unit test
        run: bash setup.sh
      - name: End-to-end smoke test
        run: bash test/smoke/run.sh
      # A stale committed jar is the failure mode this repository has had before: the loose
      # class files predated the STAR rewrite by four years. A jar embeds entry timestamps so
      # it is never byte-identical across builds; compare the class files it carries instead.
      - name: Check the committed jar matches the sources
        run: |
          rm -rf /tmp/jar-committed && mkdir -p /tmp/jar-committed
          unzip -qo PFv2.jar -d /tmp/jar-committed
          ( cd build/classes && find . -name '*.class' | sort ) > /tmp/fresh.list
          ( cd /tmp/jar-committed && find . -name '*.class' | sort ) > /tmp/committed.list
          if ! diff -u /tmp/committed.list /tmp/fresh.list; then
            echo "::error::PFv2.jar does not contain the same classes as a fresh build of src/." \
                 "Run 'make build' and commit PFv2.jar."
            exit 1
          fi
          # Content drift is reported but not failed: bytecode can differ between JDK patch
          # releases, so a mismatch here means "rebuild on the release JDK", not "broken".
          drift=0
          while read -r c; do
            cmp -s "build/classes/$c" "/tmp/jar-committed/$c" || { echo "differs: $c"; drift=1; }
          done < /tmp/fresh.list
          [ "$drift" -eq 0 ] || echo "::warning::Committed jar bytecode differs from this JDK's output; rebuild before releasing."


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the Python helpers
        run: python -m compileall -q scripts deploy/prefect
      - name: Shell syntax
        run: |
          for f in PFv2.sh setup.sh docker/entrypoint.sh test/smoke/run.sh; do
            bash -n "$f"
          done
      - name: Helm chart
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deploy/k8s \
            --set 'samples[0].id=S1' \
            --set 'samples[0].fastq=/reads/s1.fq.gz'
          helm template deploy/k8s \
            --set 'samples[0].id=S1' \
            --set 'samples[0].fastq=/reads/s1.fq.gz' > /dev/null
