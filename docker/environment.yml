# Runtime tools for the PFv2 image.
#
# Pinned, because a different STAR release reports chimeric junctions differently and that
# changes which backsplices PFv2 nominates. These are the versions the pipeline has been
# run against on both x86_64 and aarch64.
#
# bioconda publishes linux-aarch64 builds for all of these, which is what makes the image
# multi-arch without compiling anything.
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - openjdk=17
  - star=2.7.11b
  - bowtie2=2.5.4
  - samtools=1.21
