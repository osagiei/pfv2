{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pfv2.serviceAccountName" . }}
  labels: {{- include "pfv2.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# PFv2 talks to no Kubernetes API, so this account is deliberately given no role.
automountServiceAccountToken: false
{{- end }}
